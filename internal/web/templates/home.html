{{define "content"}}
<section class="intro rise">
  <p class="kicker">The desk</p>
  <h1>What are we <em>filing</em> today?</h1>
</section>

<section class="start rise" aria-labelledby="start-title">
  <h2 id="start-title" class="section-title">Start a session</h2>
  <p class="lede">Collect pages, check them, then send them to Paperless as one PDF.</p>
  <div class="tickets">
    {{range .Status.Scanners}}
    <button type="button" class="ticket{{if isFlatbed .Kind}} ticket-alt{{end}}" data-scanner="{{.ID}}" hx-post="/sessions" hx-vals='{"scanner":"{{.ID}}"}' hx-disable="this">
      <span class="ticket-kicker">{{kindLabel .Kind}}</span>
      {{if isFlatbed .Kind}}
      <span class="ticket-title">Booklets &amp; fragile pages</span>
      <span class="ticket-sub">{{.Name}} · one page per pass</span>
      {{else}}
      <span class="ticket-title">A stack of sheets</span>
      <span class="ticket-sub">{{.Name}} · batch</span>
      {{end}}
    </button>
    {{end}}
  </div>
</section>

<section id="status" class="cards rise" hx-get="/fragments/status" hx-trigger="every 5s" aria-label="Devices">
{{template "status" .Status}}
</section>

<div id="desk-lists" class="desk-lists" hx-get="/fragments/desk" hx-trigger="every 5s" hx-swap="innerMorph">
{{template "desk" .Content}}
</div>
{{end}}
