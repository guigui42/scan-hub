{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe7d6">
<meta name="htmx-config" content='{"includeIndicatorCSS":false,"defaultTimeout":30000}'>
<title>{{.Title}} · scan-hub</title>
<link rel="preload" href="/static/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css?v={{.V}}">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/app.js?v={{.V}}" defer></script>
<script src="/static/vendor/htmx-4.0.1.min.js" defer></script>
<script src="/static/vendor/alpine-csp-3.17.5.min.js" defer></script>
</head>
<body hx-headers:inherited='{"X-CSRF-Token":"{{.CSRF}}"}'
      hx-status:4xx:inherited="target:#flash swap:innerHTML"
      hx-status:5xx:inherited="target:#flash swap:innerHTML">
<header class="mast">
  <div class="mast-inner">
    <a class="brand" href="/" aria-label="scan-hub home">
      <span>scan</span><em>hub</em>
    </a>
    <p class="mast-sub">Sorting office <span aria-hidden="true">·</span> feeder, glass &amp; Paperless</p>
    <nav class="tabs" aria-label="Main">
      <a href="/" {{if eq .Nav "desk"}}aria-current="page"{{end}}>Desk</a>
      <a href="/outbox" {{if eq .Nav "outbox"}}aria-current="page"{{end}}>Outbox{{if .Status.Failed}}<span class="pip pip-bad" title="Failed">{{.Status.Failed}}</span>{{else if .Status.Waiting}}<span class="pip" title="On its way">{{.Status.Waiting}}</span>{{end}}</a>
    </nav>
  </div>
</header>
<div id="flash" class="flash-zone" role="status" aria-live="polite"></div>
<main class="desk">
{{template "content" .}}
</main>
<footer class="colophon">
  <span>scan-hub</span> <span aria-hidden="true">✦</span> ScanSnap iX500 &amp; Epson ET-2750 → Paperless-ngx
</footer>
</body>
</html>{{end}}
